services:
  # No local Postgres service — DATABASE_URL in .env points at Supabase (or any
  # hosted Postgres). Both services read it straight from .env via env_file.
  scraper:
    build: .
    env_file: .env
    volumes:
      - ./.cache:/app/.cache

  web:
    build: .
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./.cache:/app/.cache
    ports:
      - "3000:3000"
